<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RWA Banner - Data Visualization Style</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0f0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .banner-container {
      width: 100%;
      max-width: 420px;
      height: 320px;
      background: linear-gradient(135deg, #0d1a0d 0%, #0a120a 50%, #0d1a0d 100%);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    /* 背景网格 */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* 网格球体 */
    .globe-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
    }

    .globe {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    .globe::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(34, 197, 94, 0.3);
      box-shadow:
        inset 0 0 60px rgba(34, 197, 94, 0.1),
        0 0 40px rgba(34, 197, 94, 0.15);
    }

    /* 经纬线 */
    .meridian {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(34, 197, 94, 0.4) 20%,
        rgba(34, 197, 94, 0.4) 80%,
        transparent 100%);
      transform-origin: center;
    }

    .meridian:nth-child(1) { transform: translateX(-50%) rotateY(0deg); }
    .meridian:nth-child(2) { transform: translateX(-50%) rotateY(30deg); }
    .meridian:nth-child(3) { transform: translateX(-50%) rotateY(60deg); }
    .meridian:nth-child(4) { transform: translateX(-50%) rotateY(90deg); }
    .meridian:nth-child(5) { transform: translateX(-50%) rotateY(120deg); }
    .meridian:nth-child(6) { transform: translateX(-50%) rotateY(150deg); }

    .parallel {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      border: 1px solid rgba(34, 197, 94, 0.3);
      transform: translate(-50%, -50%) rotateX(75deg);
    }

    .parallel:nth-child(7) { width: 180px; height: 180px; }
    .parallel:nth-child(8) { width: 150px; height: 150px; transform: translate(-50%, -50%) rotateX(75deg) translateZ(30px); }
    .parallel:nth-child(9) { width: 120px; height: 120px; transform: translate(-50%, -50%) rotateX(75deg) translateZ(50px); }
    .parallel:nth-child(10) { width: 80px; height: 80px; transform: translate(-50%, -50%) rotateX(75deg) translateZ(65px); }

    /* RWA 文字 */
    .rwa-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 8px;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
      z-index: 10;
    }

    /* 数据节点 */
    .node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }

    .node-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      backdrop-filter: blur(4px);
      transition: all 0.3s;
    }

    .node:hover .node-icon {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.8);
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .node-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
    }

    .node-value {
      font-size: 10px;
      color: #22c55e;
      font-weight: 500;
    }

    /* 节点位置 */
    .node-1 { left: 30px; top: 60px; }
    .node-2 { right: 30px; top: 60px; }
    .node-3 { left: 20px; bottom: 70px; }
    .node-4 { right: 20px; bottom: 70px; }

    /* 连接线 SVG */
    .connections {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .connection-line {
      stroke: url(#lineGradient);
      stroke-width: 1;
      fill: none;
      opacity: 0.6;
    }

    /* 数据流动动画 */
    .data-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: flow 3s linear infinite;
    }

    @keyframes flow {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    .particle-1 { offset-path: path('M 70 84 Q 150 120 210 160'); animation-delay: 0s; }
    .particle-2 { offset-path: path('M 350 84 Q 270 120 210 160'); animation-delay: 0.5s; }
    .particle-3 { offset-path: path('M 60 250 Q 130 200 210 160'); animation-delay: 1s; }
    .particle-4 { offset-path: path('M 360 250 Q 290 200 210 160'); animation-delay: 1.5s; }

    /* 脉冲圆环 */
    .pulse-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 1px solid rgba(34, 197, 94, 0.3);
      animation: pulse 3s ease-out infinite;
    }

    .pulse-ring:nth-child(2) { animation-delay: 1s; }
    .pulse-ring:nth-child(3) { animation-delay: 2s; }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }

    /* 顶部操作栏 */
    .top-bar {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
    }

    .record-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }

    .record-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* 底部统计 */
    .stats-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      display: flex;
      justify-content: space-between;
      z-index: 20;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: #22c55e;
    }

    .stat-value span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <!-- 背景网格 -->
    <div class="grid-bg"></div>

    <!-- 脉冲圆环 -->
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>

    <!-- 连接线 -->
    <svg class="connections" viewBox="0 0 420 320">
      <defs>
        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.1" />
          <stop offset="50%" style="stop-color:#22c55e;stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.1" />
        </linearGradient>
      </defs>
      <!-- 左上到中心 -->
      <path class="connection-line" d="M 70 84 Q 150 120 210 160" />
      <!-- 右上到中心 -->
      <path class="connection-line" d="M 350 84 Q 270 120 210 160" />
      <!-- 左下到中心 -->
      <path class="connection-line" d="M 60 250 Q 130 200 210 160" />
      <!-- 右下到中心 -->
      <path class="connection-line" d="M 360 250 Q 290 200 210 160" />
    </svg>

    <!-- 数据流动粒子 -->
    <div class="data-particle particle-1"></div>
    <div class="data-particle particle-2"></div>
    <div class="data-particle particle-3"></div>
    <div class="data-particle particle-4"></div>

    <!-- 网格球体 -->
    <div class="globe-container">
      <div class="globe">
        <div class="meridian"></div>
        <div class="meridian"></div>
        <div class="meridian"></div>
        <div class="meridian"></div>
        <div class="meridian"></div>
        <div class="meridian"></div>
        <div class="parallel"></div>
        <div class="parallel"></div>
        <div class="parallel"></div>
        <div class="parallel"></div>
      </div>
      <div class="rwa-text">RWA</div>
    </div>

    <!-- 数据节点 -->
    <div class="node node-1">
      <div class="node-icon">🏢</div>
      <div class="node-label">不动产</div>
      <div class="node-value">$2.4M</div>
    </div>
    <div class="node node-2">
      <div class="node-icon">🥇</div>
      <div class="node-label">贵金属</div>
      <div class="node-value">$890K</div>
    </div>
    <div class="node node-3">
      <div class="node-icon">⚡</div>
      <div class="node-label">能源</div>
      <div class="node-value">$1.2M</div>
    </div>
    <div class="node node-4">
      <div class="node-icon">📜</div>
      <div class="node-label">债券</div>
      <div class="node-value">$3.1M</div>
    </div>

    <!-- 顶部操作栏 -->
    <div class="top-bar">
      <button class="record-btn">
        <span>📋</span>
        <span>申购记录</span>
        <span>›</span>
      </button>
    </div>

    <!-- 底部统计 -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">总资产</div>
        <div class="stat-value">$7.59<span>M</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">累计收益</div>
        <div class="stat-value">328.52 <span>USDT</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">年化率</div>
        <div class="stat-value">12.8<span>%</span></div>
      </div>
    </div>
  </div>

</body>
</html>
